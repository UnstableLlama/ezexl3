<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ezexl3 chat</title>
<script src="marked.min.js"></script>
<style>
/* ── Reset & variables ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg-primary: #0a0a0a; --bg-secondary: #111; --bg-surface: #1a1a1a;
  --border: #222; --border-light: #333;
  --text-primary: #e5e5e5; --text-muted: #999; --text-dim: #555;
  --accent: #3b82f6; --accent-hover: #2563eb;
  --green: #22c55e; --red: #ef4444; --yellow: #eab308;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono: "SF Mono", "Cascadia Code", "Fira Code", monospace;
  --radius: 8px; --radius-sm: 6px;
  --sidebar-w: 320px;
}
html, body { height: 100%; }
body {
  font-family: var(--font); background: var(--bg-primary); color: var(--text-primary);
  display: flex; overflow: hidden;
}

/* ── Sidebar ───────────────────────────────────────────────────── */
#sidebar {
  width: var(--sidebar-w); background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  overflow-y: auto; padding: 16px; flex-shrink: 0;
  transition: margin-left .2s;
}
#sidebar.hidden { margin-left: calc(-1 * var(--sidebar-w)); }
#sidebar h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); margin: 16px 0 8px; }
#sidebar h2:first-child { margin-top: 0; }
.sb-section { margin-bottom: 8px; }
.sb-row { margin-bottom: 10px; }
.sb-label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
.sb-textarea, #sidebar input[type=text], #sidebar input[type=number], #sidebar select {
  width: 100%; background: var(--bg-surface); border: 1px solid var(--border);
  color: var(--text-primary); border-radius: var(--radius-sm);
  padding: 8px 10px; font-size: 13px; font-family: var(--font); outline: none;
}
.sb-textarea:focus, #sidebar input:focus, #sidebar select:focus { border-color: var(--accent); }
.slider-row { display: flex; align-items: center; gap: 10px; }
.slider-row input[type=range] { flex: 1; accent-color: var(--accent); }
.slider-val { font-size: 12px; color: var(--text-muted); font-family: var(--mono); min-width: 40px; text-align: right; }
.toggle-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text-muted); }
.toggle {
  width: 36px; height: 20px; border-radius: 10px; background: var(--border-light);
  cursor: pointer; position: relative; transition: background .15s;
}
.toggle::after {
  content: ''; position: absolute; width: 16px; height: 16px; border-radius: 50%;
  background: var(--text-muted); top: 2px; left: 2px; transition: transform .15s, background .15s;
}
.toggle.on { background: var(--accent); }
.toggle.on::after { transform: translateX(16px); background: #fff; }
.sb-btn {
  background: var(--bg-surface); border: 1px solid var(--border);
  color: var(--text-muted); padding: 6px 12px; border-radius: var(--radius-sm);
  cursor: pointer; font-size: 12px; font-family: var(--font); transition: all .15s;
}
.sb-btn:hover { border-color: var(--accent); color: var(--text-primary); }
.sb-btn.danger:hover { border-color: var(--red); color: var(--red); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.chip-list { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
  background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 2px 8px; font-size: 12px;
  display: flex; align-items: center; gap: 4px;
}
.chip .x { cursor: pointer; color: var(--text-dim); font-size: 14px; }
.chip .x:hover { color: var(--red); }
.model-info { font-size: 12px; color: var(--text-muted); line-height: 1.6; word-break: break-all; }
.model-info strong { color: var(--text-primary); font-weight: 500; }

/* ── Main area ─────────────────────────────────────────────────── */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#header {
  display: flex; align-items: center; padding: 10px 16px;
  border-bottom: 1px solid var(--border); background: var(--bg-secondary);
  gap: 12px; min-height: 48px;
}
#toggle-sidebar { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px; padding: 4px; line-height: 1; transition: color .15s; }
#toggle-sidebar:hover { color: var(--text-primary); }
#header-title { font-size: 14px; font-weight: 500; color: var(--text-muted); }
#header-model { font-size: 13px; color: var(--text-dim); margin-left: auto; font-family: var(--mono); }

/* Auto-scroll indicator */
#auto-scroll-btn {
  background: none; border: 1px solid var(--border); color: var(--text-dim);
  cursor: pointer; font-size: 11px; padding: 3px 8px; border-radius: 12px;
  font-family: var(--font); transition: all .15s;
}
#auto-scroll-btn.active { border-color: var(--accent); color: var(--accent); }
#auto-scroll-btn:hover { color: var(--text-primary); border-color: var(--text-muted); }

/* Chat area */
#chat-area { flex: 1; overflow-y: auto; padding: 24px 0; display: flex; flex-direction: column; }
#messages { max-width: 780px; width: 100%; margin: 0 auto; padding: 0 24px; }

/* Messages */
.msg { margin-bottom: 24px; animation: fadeIn .2s ease; position: relative; }
.msg:hover .msg-actions { opacity: 1; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
.msg-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.msg-role { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.msg-role.user { color: var(--accent); }
.msg-role.assistant { color: var(--green); }
.msg-body { font-size: 14px; line-height: 1.7; color: var(--text-primary); }
.msg-body p { margin-bottom: 10px; }
.msg-body p:last-child { margin-bottom: 0; }
.msg-body ul, .msg-body ol { margin: 8px 0 8px 20px; }
.msg-body li { margin-bottom: 4px; }
.msg-body strong { font-weight: 600; }

/* Message actions */
.msg-actions {
  display: flex; gap: 4px; opacity: 0; transition: opacity .15s;
  margin-left: auto;
}
.msg-action-btn {
  background: none; border: 1px solid transparent; color: var(--text-dim);
  cursor: pointer; font-size: 13px; padding: 2px 6px; border-radius: 4px;
  font-family: var(--font); transition: all .1s; line-height: 1;
}
.msg-action-btn:hover { color: var(--text-primary); border-color: var(--border-light); }
.msg-action-btn.danger:hover { color: var(--red); }

/* Branch navigation */
.branch-nav {
  display: inline-flex; align-items: center; gap: 2px;
  font-size: 11px; color: var(--text-dim); font-family: var(--mono);
  margin-left: 8px;
}
.branch-nav button {
  background: none; border: none; color: var(--text-dim); cursor: pointer;
  font-size: 13px; padding: 0 2px; line-height: 1; transition: color .1s;
}
.branch-nav button:hover { color: var(--text-primary); }
.branch-nav button:disabled { cursor: default; opacity: .3; }

/* Code blocks */
.msg-body pre {
  background: #111; border: 1px solid var(--border-light); border-radius: var(--radius-sm);
  padding: 14px 16px; overflow-x: auto; margin: 10px 0; font-size: 13px; line-height: 1.5;
}
.msg-body code { font-family: var(--mono); font-size: 0.9em; }
.msg-body :not(pre) > code {
  background: var(--bg-surface); padding: 2px 6px; border-radius: 3px; border: 1px solid var(--border);
}

/* Think blocks */
.think-block { border-left: 2px solid var(--border-light); margin: 8px 0; padding: 0; }
.think-toggle {
  background: none; border: none; color: var(--text-dim); cursor: pointer;
  font-size: 12px; padding: 4px 8px; font-family: var(--font);
}
.think-toggle:hover { color: var(--text-muted); }
.think-content { padding: 8px 12px; color: var(--text-dim); font-size: 13px; line-height: 1.6; display: none; }
.think-content.open { display: block; }

/* TPS badge */
.msg-tps { font-size: 11px; color: var(--text-dim); margin-top: 8px; font-family: var(--mono); }

/* Streaming cursor */
.cursor {
  display: inline-block; width: 7px; height: 16px; background: var(--accent);
  margin-left: 2px; animation: blink .6s infinite; vertical-align: text-bottom;
}
@keyframes blink { 50% { opacity: 0; } }

/* Empty state */
#empty-state {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: var(--text-dim); gap: 8px;
}
#empty-state .logo { font-size: 32px; opacity: .3; }
#empty-state .hint { font-size: 13px; }

/* Keyboard shortcuts hint */
.shortcuts-hint { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
.shortcuts-hint kbd {
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: 3px;
  padding: 1px 5px; font-family: var(--mono); font-size: 10px;
}

/* Edit textarea */
.msg-edit-area {
  width: 100%; background: var(--bg-surface); border: 1px solid var(--border-light);
  border-radius: var(--radius-sm); padding: 10px 14px; color: var(--text-primary);
  font-size: 14px; font-family: var(--font); resize: vertical; min-height: 60px;
  outline: none; line-height: 1.5;
}
.msg-edit-area:focus { border-color: var(--accent); }
.msg-edit-actions { display: flex; gap: 6px; margin-top: 6px; }
.msg-edit-actions button {
  padding: 4px 12px; border-radius: var(--radius-sm); font-size: 12px;
  cursor: pointer; font-family: var(--font); border: 1px solid var(--border);
  transition: all .15s;
}
.msg-edit-save { background: var(--accent); color: #fff; border-color: var(--accent); }
.msg-edit-save:hover { background: var(--accent-hover); }
.msg-edit-cancel { background: var(--bg-surface); color: var(--text-muted); }
.msg-edit-cancel:hover { color: var(--text-primary); }

/* ── Input area ────────────────────────────────────────────────── */
#input-area { padding: 12px 24px 16px; background: var(--bg-primary); border-top: 1px solid var(--border); }
#input-wrap { max-width: 780px; margin: 0 auto; display: flex; align-items: flex-end; gap: 10px; }
#input-box {
  flex: 1; background: var(--bg-surface); border: 1px solid var(--border-light);
  border-radius: var(--radius); padding: 12px 16px; color: var(--text-primary);
  font-size: 14px; font-family: var(--font); resize: none; outline: none;
  min-height: 44px; max-height: 200px; line-height: 1.5; transition: border-color .15s;
}
#input-box:focus { border-color: var(--accent); }
#input-box::placeholder { color: var(--text-dim); }
#send-btn, #stop-btn {
  width: 42px; height: 42px; border-radius: var(--radius); border: none;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background .15s; flex-shrink: 0;
}
#send-btn { background: var(--accent); color: #fff; }
#send-btn:hover { background: var(--accent-hover); }
#send-btn:disabled { background: var(--bg-surface); color: var(--text-dim); cursor: default; }
#stop-btn { background: var(--red); color: #fff; display: none; }
#stop-btn:hover { background: #dc2626; }

/* ── Scrollbar ─────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

/* ── Responsive ────────────────────────────────────────────────── */
@media (max-width: 768px) {
  :root { --sidebar-w: 280px; }
  #sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 100; }
  #sidebar.hidden { margin-left: 0; transform: translateX(-100%); }
  #messages { padding: 0 16px; }
  #input-area { padding: 10px 16px 12px; }
}
</style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">
  <h2>Settings</h2>
  <div class="sb-section">
    <div class="sb-row">
      <label class="sb-label">Prompt Mode</label>
      <select id="s-mode"></select>
    </div>
    <div class="sb-row">
      <label class="sb-label">System Prompt</label>
      <textarea class="sb-textarea" id="s-system" rows="4"></textarea>
    </div>
  </div>

  <h2>Sampling</h2>
  <div class="sb-section">
    <div class="sb-row">
      <label class="sb-label">Temperature</label>
      <div class="slider-row">
        <input type="range" id="s-temp" min="0" max="2" step="0.05" value="0.8">
        <span class="slider-val" id="v-temp">0.80</span>
      </div>
    </div>
    <div class="sb-row">
      <label class="sb-label">Top-K</label>
      <div class="slider-row">
        <input type="range" id="s-topk" min="0" max="200" step="1" value="50">
        <span class="slider-val" id="v-topk">50</span>
      </div>
    </div>
    <div class="sb-row">
      <label class="sb-label">Top-P</label>
      <div class="slider-row">
        <input type="range" id="s-topp" min="0" max="1" step="0.01" value="0.9">
        <span class="slider-val" id="v-topp">0.90</span>
      </div>
    </div>
    <div class="sb-row">
      <label class="sb-label">Min-P</label>
      <div class="slider-row">
        <input type="range" id="s-minp" min="0" max="0.5" step="0.005" value="0">
        <span class="slider-val" id="v-minp">0.00</span>
      </div>
    </div>
    <div class="sb-row">
      <label class="sb-label">Repetition Penalty</label>
      <div class="slider-row">
        <input type="range" id="s-rep" min="1" max="2" step="0.01" value="1">
        <span class="slider-val" id="v-rep">1.00</span>
      </div>
    </div>
    <div class="sb-row">
      <label class="sb-label">Max Response Tokens</label>
      <div class="slider-row">
        <input type="range" id="s-maxtok" min="64" max="16384" step="64" value="1000">
        <span class="slider-val" id="v-maxtok">1000</span>
      </div>
    </div>
  </div>

  <h2>Reasoning</h2>
  <div class="sb-section">
    <div class="sb-row toggle-row">
      <span>Think mode</span>
      <div class="toggle" id="t-think" data-key="think"></div>
    </div>
    <div class="sb-row toggle-row">
      <span>Suppress think tags</span>
      <div class="toggle" id="t-nothink" data-key="no_think"></div>
    </div>
    <div class="sb-row">
      <label class="sb-label">Think Budget</label>
      <input type="number" id="s-thinkbudget" placeholder="(none)" min="0" step="256">
    </div>
  </div>

  <h2>Behavior</h2>
  <div class="sb-section">
    <div class="sb-row toggle-row">
      <span>Amnesia mode</span>
      <div class="toggle" id="t-amnesia" data-key="amnesia"></div>
    </div>
    <div class="sb-row">
      <label class="sb-label">Banned Strings</label>
      <div class="chip-list" id="banned-chips"></div>
      <div style="display:flex;gap:6px;margin-top:6px">
        <input type="text" id="banned-input" placeholder="Add string...">
        <button class="sb-btn" onclick="addBan()">+</button>
      </div>
    </div>
  </div>

  <h2>Session</h2>
  <div class="sb-section">
    <div class="btn-row">
      <button class="sb-btn" onclick="saveSession()">Save</button>
      <button class="sb-btn" onclick="loadSession()">Load</button>
      <button class="sb-btn" onclick="exportMarkdown()">Export MD</button>
      <button class="sb-btn danger" onclick="clearContext()">Clear</button>
    </div>
  </div>

  <h2>Model</h2>
  <div class="sb-section">
    <div class="model-info" id="model-info">Loading...</div>
  </div>
</div>

<!-- Main -->
<div id="main">
  <div id="header">
    <button id="toggle-sidebar" title="Toggle settings">&#9776;</button>
    <span id="header-title">ezexl3 chat</span>
    <button id="auto-scroll-btn" class="active" title="Toggle auto-scroll">Auto-scroll</button>
    <span id="header-model"></span>
  </div>
  <div id="chat-area">
    <div id="messages">
      <div id="empty-state">
        <div class="logo">&#x2728;</div>
        <div class="hint">Send a message to start chatting</div>
        <div class="shortcuts-hint">
          <kbd>Enter</kbd> send &middot; <kbd>Shift+Enter</kbd> newline &middot;
          <kbd>Ctrl+Shift+Backspace</kbd> stop &middot; <kbd>&#x2191;</kbd> edit last
        </div>
      </div>
    </div>
  </div>
  <div id="input-area">
    <div id="input-wrap">
      <textarea id="input-box" placeholder="Type a message... (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
      <button id="send-btn" title="Send">&#9654;</button>
      <button id="stop-btn" title="Stop">&#9632;</button>
    </div>
  </div>
</div>

<input type="file" id="file-input" accept=".json" style="display:none">

<script>
// ── State ───────────────────────────────────────────────────────
let generating = false;
let tree = { nodes: {}, root_children: [], active_root: -1 };
let settings = {};
let modes = {};
let autoScroll = true;
let tpsDataMap = {};  // nodeId -> tps data
let _renderRAF = null;
let _pendingStreamNodeId = null;
let _pendingStreamText = null;

function scheduleRender(streamNodeId, streamText) {
  _pendingStreamNodeId = streamNodeId;
  _pendingStreamText = streamText;
  if (!_renderRAF) {
    _renderRAF = requestAnimationFrame(() => {
      _renderRAF = null;
      renderTree(_pendingStreamNodeId, _pendingStreamText);
    });
  }
}

function addOptimisticMessage(role, text) {
  emptyState.style.display = 'none';
  const msg = document.createElement('div');
  msg.className = 'msg';
  const header = document.createElement('div');
  header.className = 'msg-header';
  const roleEl = document.createElement('div');
  roleEl.className = `msg-role ${role}`;
  roleEl.textContent = role;
  header.appendChild(roleEl);
  msg.appendChild(header);
  const body = document.createElement('div');
  body.className = 'msg-body';
  if (role === 'user') {
    body.textContent = text || '';
  } else {
    body.innerHTML = '<span class="cursor"></span>';
  }
  msg.appendChild(body);
  msgContainer.appendChild(msg);
  return msg;
}

function addOptimisticMessage(role, text) {
  emptyState.style.display = 'none';
  const msg = document.createElement('div');
  msg.className = 'msg';
  const header = document.createElement('div');
  header.className = 'msg-header';
  const roleEl = document.createElement('div');
  roleEl.className = `msg-role ${role}`;
  roleEl.textContent = role;
  header.appendChild(roleEl);
  msg.appendChild(header);
  const body = document.createElement('div');
  body.className = 'msg-body';
  if (role === 'user') {
    body.textContent = text || '';
  } else {
    body.innerHTML = '<span class="cursor"></span>';
  }
  msg.appendChild(body);
  msgContainer.appendChild(msg);
  return msg;
}

const msgContainer = document.getElementById('messages');
const emptyState = document.getElementById('empty-state');
const inputBox = document.getElementById('input-box');
const sendBtn = document.getElementById('send-btn');
const stopBtn = document.getElementById('stop-btn');
const sidebar = document.getElementById('sidebar');
const chatArea = document.getElementById('chat-area');
const autoScrollBtn = document.getElementById('auto-scroll-btn');

// ── Init ────────────────────────────────────────────────────────
(async () => {
  const [statusRes, settingsRes, treeRes] = await Promise.all([
    fetch('/api/status'), fetch('/api/settings'), fetch('/api/tree'),
  ]);
  const status = await statusRes.json();
  settings = await settingsRes.json();
  tree = await treeRes.json();
  modes = status.available_modes || {};
  populateUI(status);
  renderTree();
})();

function populateUI(status) {
  const sel = document.getElementById('s-mode');
  sel.innerHTML = '';
  for (const [k, desc] of Object.entries(modes)) {
    const opt = document.createElement('option');
    opt.value = k; opt.textContent = `${k} — ${desc}`;
    sel.appendChild(opt);
  }
  sel.value = settings.mode || 'chatml';
  document.getElementById('s-system').value = settings.system_prompt || '';
  setSlider('s-temp','v-temp',settings.temperature,v=>v.toFixed(2));
  setSlider('s-topk','v-topk',settings.top_k,v=>String(Math.round(v)));
  setSlider('s-topp','v-topp',settings.top_p,v=>v.toFixed(2));
  setSlider('s-minp','v-minp',settings.min_p,v=>v.toFixed(3));
  setSlider('s-rep','v-rep',settings.repetition_penalty,v=>v.toFixed(2));
  setSlider('s-maxtok','v-maxtok',settings.max_response_tokens,v=>String(Math.round(v)));
  setToggle('t-think', settings.think);
  setToggle('t-nothink', settings.no_think);
  setToggle('t-amnesia', settings.amnesia);
  const tb = document.getElementById('s-thinkbudget');
  tb.value = settings.think_budget != null ? settings.think_budget : '';
  renderBans();
  document.getElementById('model-info').innerHTML =
    `<strong>${status.model_name}</strong><br>Context: ${(status.context_length||0).toLocaleString()} tokens<br>${status.model_dir||''}`;
  document.getElementById('header-model').textContent = status.model_name || '';
}

// ── Slider / Toggle helpers ─────────────────────────────────────
function setSlider(sid,vid,value,fmt){
  const sl=document.getElementById(sid),vl=document.getElementById(vid);
  sl.value=value; vl.textContent=fmt(Number(value));
  sl.oninput=()=>{vl.textContent=fmt(Number(sl.value));};
  sl.onchange=()=>syncSettings();
}
function setToggle(id,value){
  const el=document.getElementById(id);
  el.classList.toggle('on',!!value);
  el.onclick=()=>{el.classList.toggle('on');syncSettings();};
}

// ── Sync settings ───────────────────────────────────────────────
let syncTimer=null;
function syncSettings(){
  clearTimeout(syncTimer);
  syncTimer=setTimeout(async()=>{
    const s={
      mode:document.getElementById('s-mode').value,
      system_prompt:document.getElementById('s-system').value,
      temperature:parseFloat(document.getElementById('s-temp').value),
      top_k:parseInt(document.getElementById('s-topk').value),
      top_p:parseFloat(document.getElementById('s-topp').value),
      min_p:parseFloat(document.getElementById('s-minp').value),
      repetition_penalty:parseFloat(document.getElementById('s-rep').value),
      max_response_tokens:parseInt(document.getElementById('s-maxtok').value),
      think:document.getElementById('t-think').classList.contains('on'),
      no_think:document.getElementById('t-nothink').classList.contains('on'),
      amnesia:document.getElementById('t-amnesia').classList.contains('on'),
      banned_strings:settings.banned_strings||[],
    };

// ── Tree rendering ──────────────────────────────────────────────
function getActivePath() {
  // Walk the tree and return array of {role, content, nodeId, siblings, siblingIdx}
  const path = [];
  if (!tree.root_children.length || tree.active_root < 0) return path;
  let currentId = tree.root_children[tree.active_root];
  while (currentId) {
    const node = tree.nodes[currentId];
    if (!node) break;
    // Determine siblings
    let siblings, sibIdx;
    if (node.parent_id === null || node.parent_id === undefined) {
      siblings = tree.root_children;
      sibIdx = siblings.indexOf(currentId);
    } else {
      const parent = tree.nodes[node.parent_id];
      siblings = parent ? parent.children : [currentId];
      sibIdx = siblings.indexOf(currentId);
    }
    path.push({
      role: node.role,
      content: node.content,
      nodeId: currentId,
      siblings: siblings,
      siblingIdx: sibIdx,
    });
    // Follow active child
    if (node.children && node.children.length > 0 && node.active_child >= 0) {
      currentId = node.children[node.active_child];
    } else {
      currentId = null;
    }
  }
  return path;
}

function renderTree(streamingNodeId, streamingText) {
  const path = getActivePath();
  const hasMessages = path.length > 0;

  // Clear and rebuild
  msgContainer.innerHTML = '';
  if (!hasMessages && !generating) {
    msgContainer.appendChild(emptyState);
    emptyState.style.display = '';
    return;
  }
  emptyState.style.display = 'none';

  for (const entry of path) {
    const isStreaming = streamingNodeId && entry.nodeId === streamingNodeId;
    const content = isStreaming ? streamingText : entry.content;

    const msg = document.createElement('div');
    msg.className = 'msg';
    msg.dataset.nodeId = entry.nodeId;

    // Header with role, branch nav, and action buttons
    const header = document.createElement('div');
    header.className = 'msg-header';
    const roleEl = document.createElement('div');
    roleEl.className = `msg-role ${entry.role}`;
    roleEl.textContent = entry.role;
    header.appendChild(roleEl);

    // Branch navigation (only if >1 sibling)
    if (entry.siblings.length > 1) {
      const nav = document.createElement('span');
      nav.className = 'branch-nav';
      const prevBtn = document.createElement('button');
      prevBtn.textContent = '<';
      prevBtn.disabled = entry.siblingIdx <= 0;
      prevBtn.onclick = () => navigateBranch(entry.nodeId, entry.siblingIdx - 1);
      const label = document.createElement('span');
      label.textContent = `${entry.siblingIdx + 1}/${entry.siblings.length}`;
      const nextBtn = document.createElement('button');
      nextBtn.textContent = '>';
      nextBtn.disabled = entry.siblingIdx >= entry.siblings.length - 1;
      nextBtn.onclick = () => navigateBranch(entry.nodeId, entry.siblingIdx + 1);
      nav.appendChild(prevBtn);
      nav.appendChild(label);
      nav.appendChild(nextBtn);
      header.appendChild(nav);
    }

    // Action buttons
    if (!generating) {
      const actions = document.createElement('div');
      actions.className = 'msg-actions';

      if (entry.role === 'user') {
        actions.appendChild(makeActionBtn('Edit', () => startEdit(entry.nodeId)));
      }
      if (entry.role === 'assistant' && entry.content) {
        actions.appendChild(makeActionBtn('Regen', () => regenerateMessage(entry.nodeId)));
        actions.appendChild(makeActionBtn('Copy', () => copyMessage(entry.content)));
      }
      actions.appendChild(makeActionBtn('Del', () => deleteMessage(entry.nodeId), true));
      header.appendChild(actions);
    }

    msg.appendChild(header);

    // Body
    const body = document.createElement('div');
    body.className = 'msg-body';
    if (entry.role === 'user') {
      body.textContent = content || '';
    } else if (isStreaming) {
      renderStreamingInto(body, content || '');
    } else if (content) {
      renderFinalInto(body, content);
    }
    msg.appendChild(body);

    // TPS badge
    const tps = tpsDataMap[entry.nodeId];
    if (tps && !isStreaming) {
      const badge = document.createElement('div');
      badge.className = 'msg-tps';
      const ctx = tps.prompt_tokens ? `${tps.prompt_tokens.toLocaleString()} ctx` : '';
      const cached = tps.cached_tokens ? ` (${tps.cached_tokens.toLocaleString()} cached)` : '';
      let parts = [];
      if (ctx) parts.push(ctx + cached);
      parts.push(`${tps.new_tokens} gen · ${tps.tps} t/s · ${tps.elapsed}s`);
      if (tps.prefill_tps) parts.push(`prefill ${tps.prefill_tps} t/s`);
      badge.textContent = parts.join(' · ');
      msg.appendChild(badge);
    }

    msgContainer.appendChild(msg);
  }

  if (autoScroll) scrollToBottom();
}

function makeActionBtn(label, onclick, danger) {
  const btn = document.createElement('button');
  btn.className = 'msg-action-btn' + (danger ? ' danger' : '');
  btn.textContent = label;
  btn.onclick = onclick;
  return btn;
}

// ── Send message ────────────────────────────────────────────────
async function sendMessage() {
  const text = inputBox.value.trim();
  if (!text || generating) return;
  inputBox.value = '';
  inputBox.style.height = 'auto';
  setGenerating(true);

  // Optimistic UI: show user message + empty assistant immediately
  addOptimisticMessage('user', text);
  const assistantEl = addOptimisticMessage('assistant', '');
  const bodyEl = assistantEl.querySelector('.msg-body');
  scrollToBottom();

  let fullText = '';
  let tpsData = null;

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ message: text }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6);
        if (payload === '[DONE]') continue;
        try {
          const evt = JSON.parse(payload);
          if (evt.type === 'token') {
            fullText += evt.text;
            renderStreamingInto(bodyEl, fullText);
            if (autoScroll) scrollToBottom();
          } else if (evt.type === 'tps') {
            tpsData = evt;
          } else if (evt.type === 'error') {
            fullText += `\n\n**Error:** ${evt.message}`;
            renderStreamingInto(bodyEl, fullText);
          }
        } catch {}
      }
    }
  } catch (e) {
    fullText += `\n\n**Error:** ${e.message}`;
    renderStreamingInto(bodyEl, fullText);
  }

  // Final render
  renderFinalInto(bodyEl, fullText);
  if (tpsData) {
    const badge = document.createElement('div');
    badge.className = 'msg-tps';
    const ctx = tpsData.prompt_tokens ? `${tpsData.prompt_tokens.toLocaleString()} ctx` : '';
    const cached = tpsData.cached_tokens ? ` (${tpsData.cached_tokens.toLocaleString()} cached)` : '';
    let parts = [];
    if (ctx) parts.push(ctx + cached);
    parts.push(`${tpsData.new_tokens} gen · ${tpsData.tps} t/s · ${tpsData.elapsed}s`);
    if (tpsData.prefill_tps) parts.push(`prefill ${tpsData.prefill_tps} t/s`);
    badge.textContent = parts.join(' · ');
    assistantEl.appendChild(badge);
  }

  // Sync tree state for branch nav / action buttons
  try {
    const treeRes = await fetch('/api/tree');
    tree = await treeRes.json();
  } catch {}
  setGenerating(false);
  renderTree();
  inputBox.focus();
}

// ── Regenerate ──────────────────────────────────────────────────
async function regenerateMessage(nodeId) {
  if (generating) return;
  setGenerating(true);

  // Optimistic UI: clear the assistant body and show cursor
  const msgEl = msgContainer.querySelector(`[data-node-id="${nodeId}"]`);
  let bodyEl;
  if (msgEl) {
    bodyEl = msgEl.querySelector('.msg-body');
    bodyEl.innerHTML = '<span class="cursor"></span>';
    const tpsBadge = msgEl.querySelector('.msg-tps');
    if (tpsBadge) tpsBadge.remove();
  } else {
    const asstEl = addOptimisticMessage('assistant', '');
    bodyEl = asstEl.querySelector('.msg-body');
  }
  scrollToBottom();

  let fullText = '';

  try {
    const resp = await fetch('/api/regenerate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ node_id: nodeId }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6);
        if (payload === '[DONE]') continue;
        try {
          const evt = JSON.parse(payload);
          if (evt.type === 'token') { fullText += evt.text; renderStreamingInto(bodyEl, fullText); if (autoScroll) scrollToBottom(); }
          if (evt.type === 'error') { fullText += `\n\n**Error:** ${evt.message}`; renderStreamingInto(bodyEl, fullText); }
        } catch {}
      }
    }
  } catch (e) { fullText += `\n\n**Error:** ${e.message}`; renderStreamingInto(bodyEl, fullText); }

  renderFinalInto(bodyEl, fullText);
  try { const treeRes = await fetch('/api/tree'); tree = await treeRes.json(); } catch {}
  setGenerating(false);
  renderTree();
}

// ── Edit message ────────────────────────────────────────────────
function startEdit(nodeId) {
  const node = tree.nodes[nodeId];
  if (!node) return;
  const msgEl = msgContainer.querySelector(`[data-node-id="${nodeId}"]`);
  if (!msgEl) return;
  const body = msgEl.querySelector('.msg-body');
  const original = node.content || '';
  body.innerHTML = '';
  const textarea = document.createElement('textarea');
  textarea.className = 'msg-edit-area';
  textarea.value = original;
  const btns = document.createElement('div');
  btns.className = 'msg-edit-actions';
  const saveBtn = document.createElement('button');
  saveBtn.className = 'msg-edit-save';
  saveBtn.textContent = 'Save & Send';
  saveBtn.onclick = () => submitEdit(nodeId, textarea.value.trim());
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'msg-edit-cancel';
  cancelBtn.textContent = 'Cancel';
  cancelBtn.onclick = () => renderTree();
  btns.appendChild(saveBtn);
  btns.appendChild(cancelBtn);
  body.appendChild(textarea);
  body.appendChild(btns);
  textarea.focus();
  textarea.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitEdit(nodeId, textarea.value.trim()); }
    if (e.key === 'Escape') renderTree();
  });
}

async function submitEdit(nodeId, content) {
  if (!content || generating) return;
  setGenerating(true);

  // Optimistic UI: update user message text, remove everything after it,
  // and add a fresh assistant element with cursor
  const msgEl = msgContainer.querySelector(`[data-node-id="${nodeId}"]`);
  if (msgEl) {
    const body = msgEl.querySelector('.msg-body');
    body.textContent = content;
    while (msgEl.nextElementSibling) msgEl.nextElementSibling.remove();
  }
  const asstEl = addOptimisticMessage('assistant', '');
  const bodyEl = asstEl.querySelector('.msg-body');
  scrollToBottom();

  let fullText = '';

  try {
    const resp = await fetch('/api/edit', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ node_id: nodeId, content: content }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6);
        if (payload === '[DONE]') continue;
        try {
          const evt = JSON.parse(payload);
          if (evt.type === 'token') { fullText += evt.text; renderStreamingInto(bodyEl, fullText); if (autoScroll) scrollToBottom(); }
          if (evt.type === 'error') { fullText += `\n\n**Error:** ${evt.message}`; renderStreamingInto(bodyEl, fullText); }
        } catch {}
      }
    }
  } catch (e) { fullText += `\n\n**Error:** ${e.message}`; renderStreamingInto(bodyEl, fullText); }

  renderFinalInto(bodyEl, fullText);
  try { const treeRes = await fetch('/api/tree'); tree = await treeRes.json(); } catch {}
  setGenerating(false);
  renderTree();
}

function editLastUserMessage() {
  const path = getActivePath();
  for (let i = path.length - 1; i >= 0; i--) {
    if (path[i].role === 'user') { startEdit(path[i].nodeId); return; }
  }
}

// ── Export as Markdown ──────────────────────────────────────────
function exportMarkdown() {
  const path = getActivePath();
  if (!path.length) return;
  let md = '';
  for (const entry of path) {
    const label = entry.role === 'user' ? '**User**' : '**Assistant**';
    md += `### ${label}\n\n${entry.content || '(empty)'}\n\n---\n\n`;
  }
  const blob = new Blob([md], {type: 'text/markdown'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'conversation.md';
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── Markdown rendering ──────────────────────────────────────────
marked.setOptions({ breaks: true, gfm: true });

function renderStreamingInto(el, text) {
  const {html} = processThinkTags(text);
  el.innerHTML = html + '<span class="cursor"></span>';
}

function renderFinalInto(el, text) {
  const {html} = processThinkTags(text);
  el.innerHTML = html;
}

function processThinkTags(text) {
  let html = '';
  let remaining = text;
  let thinkOpen = false;

  while (remaining.length > 0) {
    const openIdx = remaining.indexOf('<think>');
    if (openIdx === -1) {
      if (thinkOpen) {
        html += renderThinkContent(remaining, true);
        remaining = '';
        thinkOpen = true;
      } else {
        html += renderMarkdown(remaining);
        remaining = '';
      }
    } else {
      if (openIdx > 0) html += renderMarkdown(remaining.substring(0, openIdx));
      remaining = remaining.substring(openIdx + 7);
      const closeIdx = remaining.indexOf('</think>');
      if (closeIdx === -1) {
        html += renderThinkContent(remaining, true);
        remaining = '';
        thinkOpen = true;
      } else {
        html += renderThinkContent(remaining.substring(0, closeIdx), false);
        remaining = remaining.substring(closeIdx + 8);
      }
    }
  }
  return {html, thinkOpen};
}

function renderThinkContent(text, isOpen) {
  const label = isOpen ? 'Thinking...' : 'Thought';
  const openClass = isOpen ? ' open' : '';
  return `<div class="think-block">` +
    `<button class="think-toggle" onclick="this.nextElementSibling.classList.toggle('open');this.textContent=this.nextElementSibling.classList.contains('open')?'▼ ${label}':'▶ ${label}'">${isOpen ? '▼' : '▶'} ${label}</button>` +
    `<div class="think-content${openClass}">${renderMarkdown(text)}</div></div>`;
}

function renderMarkdown(text) {
  if (!text.trim()) return '';
  try { return marked.parse(text); }
  catch { return `<p>${escHtml(text)}</p>`; }
}
