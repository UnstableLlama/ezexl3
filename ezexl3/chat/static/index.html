<style>
/* ── Tokens ────────────────────────────────────────────────────── */
:root {
  --bg-primary:   #0d0d0d;
  --bg-secondary: #1a1a1a;
  --bg-surface:   #242424;
  --text-primary: #e8e8e8;
  --text-muted:   #a0a0a0;
  --text-dim:     #666;
  --accent:       #6366f1;
  --accent-hover: #818cf8;
  --border:       #2a2a2a;
  --border-light: #333;
  --red:          #ef4444;
  --font:         -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
  --mono:         'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  --sidebar-w:    340px;
  --radius:       10px;
  --radius-sm:    6px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg-primary); color: var(--text-primary); font-family: var(--font); }

/* ── Layout ────────────────────────────────────────────────────── */
body { display: flex; overflow: hidden; }
#sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  overflow-y: auto; padding: 16px 20px;
  transition: margin-left .25s ease;
}
#sidebar.hidden { margin-left: calc(-1 * var(--sidebar-w)); }
#main {
  flex: 1; display: flex; flex-direction: column;
  min-width: 0;
}
#header {
  height: 48px; display: flex; align-items: center;
  padding: 0 16px; border-bottom: 1px solid var(--border);
  gap: 12px; flex-shrink: 0;
}
#toggle-sidebar {
  background: none; border: none; color: var(--text-muted);
  font-size: 20px; cursor: pointer; padding: 4px 8px;
}
#header-title { font-weight: 600; font-size: 14px; }
#header-model { color: var(--text-dim); font-size: 12px; margin-left: auto; font-family: var(--mono); }

#chat-area {
  flex: 1; overflow-y: auto; scroll-behavior: smooth;
}
#messages {
  max-width: 780px; margin: 0 auto;
  padding: 24px 24px 16px;
  display: flex; flex-direction: column; gap: 6px;
}

/* ── Sidebar widgets ───────────────────────────────────────────── */
#sidebar h2 {
  font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--text-dim); margin: 20px 0 8px;
}
#sidebar h2:first-child { margin-top: 0; }
.sb-section { display: flex; flex-direction: column; gap: 10px; }
.sb-row { display: flex; flex-direction: column; gap: 4px; }
.sb-label { font-size: 12px; color: var(--text-muted); }
.sb-textarea, #sidebar input[type="text"], #sidebar input[type="number"] {
  background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 8px 10px;
  color: var(--text-primary); font-size: 13px; font-family: var(--font);
  outline: none; width: 100%;
}
.sb-textarea:focus, #sidebar input:focus { border-color: var(--accent); }
.sb-textarea { resize: vertical; min-height: 60px; line-height: 1.4; }
#sidebar select {
  background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 6px 8px;
  color: var(--text-primary); font-size: 13px; outline: none; width: 100%;
}
.slider-row { display: flex; align-items: center; gap: 10px; }
.slider-row input[type="range"] { flex: 1; accent-color: var(--accent); }
.slider-val { font-size: 12px; color: var(--text-muted); font-family: var(--mono); min-width: 42px; text-align: right; }

/* Toggles */
.toggle-row { flex-direction: row; align-items: center; justify-content: space-between; }
.toggle {
  width: 36px; height: 20px; border-radius: 10px;
  background: var(--bg-surface); border: 1px solid var(--border);
  cursor: pointer; position: relative; transition: background .2s;
}
.toggle::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--text-dim); transition: transform .2s, background .2s;
}
.toggle.on { background: var(--accent); border-color: var(--accent); }
.toggle.on::after { transform: translateX(16px); background: #fff; }

/* Chips */
.chip-list { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 2px 8px; font-size: 12px;
}
.chip .x { cursor: pointer; color: var(--text-dim); font-size: 14px; }
.chip .x:hover { color: var(--red); }

/* Buttons */
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.sb-btn {
  background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 6px 12px;
  color: var(--text-muted); font-size: 12px; cursor: pointer;
  transition: border-color .15s;
}
.sb-btn:hover { border-color: var(--text-dim); color: var(--text-primary); }
.sb-btn.danger:hover { border-color: var(--red); color: var(--red); }

.model-info { font-size: 12px; color: var(--text-muted); line-height: 1.6; word-break: break-all; }

/* ── Messages ──────────────────────────────────────────────────── */
.msg {
  display: grid;
  grid-template-columns: 72px 1fr;
  gap: 0 12px;
  padding: 12px 0;
}
.msg-role {
  font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
  color: var(--text-dim); padding-top: 2px; text-align: right;
  font-weight: 600;
}
.msg-role.user { color: var(--accent); }
.msg-body {
  font-size: 14px; line-height: 1.7;
  overflow-wrap: break-word;
  min-width: 0;
}
.msg-body p { margin: 0 0 8px; }
.msg-body p:last-child { margin-bottom: 0; }
.msg-body ul, .msg-body ol { margin: 4px 0 8px 20px; }
.msg-body blockquote {
  border-left: 3px solid var(--border-light);
  padding-left: 12px; color: var(--text-muted);
  margin: 8px 0;
}
.msg-body table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
.msg-body th, .msg-body td { border: 1px solid var(--border-light); padding: 6px 10px; }
.msg-body th { background: var(--bg-surface); }

/* Code blocks */
.msg-body pre {
  background: #111;
  border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  overflow-x: auto;
  margin: 10px 0;
  font-size: 13px;
  line-height: 1.5;
}
.msg-body code {
  font-family: var(--mono);
  font-size: 0.9em;
}
.msg-body :not(pre) > code {
  background: var(--bg-surface);
  padding: 2px 6px;
  border-radius: 3px;
  border: 1px solid var(--border);
}

/* Think blocks */
.think-block {
  border-left: 2px solid var(--border-light);
  margin: 8px 0;
  padding: 0;
}
.think-toggle {
  background: none; border: none; color: var(--text-dim);
  cursor: pointer; font-size: 12px; padding: 4px 8px;
  font-family: var(--font);
}
.think-toggle:hover { color: var(--text-muted); }
.think-content {
  padding: 8px 12px;
  color: var(--text-dim);
  font-size: 13px;
  line-height: 1.6;
  display: none;
}
.think-content.open { display: block; }

/* TPS badge */
.msg-tps {
  font-size: 11px; color: var(--text-dim);
  margin-top: 8px; font-family: var(--mono);
}

/* Streaming cursor */
.cursor {
  display: inline-block; width: 7px; height: 16px;
  background: var(--accent); margin-left: 2px;
  animation: blink .6s infinite;
  vertical-align: text-bottom;
}
@keyframes blink { 50% { opacity: 0; } }

/* ── Branch navigation ─────────────────────────────────────────── */
.msg-header {
  display: flex; align-items: center; gap: 8px;
  grid-column: 2;
}
.branch-nav {
  display: inline-flex; align-items: center; gap: 2px;
  font-size: 11px; color: var(--text-dim); font-family: var(--mono);
}
.branch-nav button {
  background: none; border: 1px solid var(--border);
  color: var(--text-muted); cursor: pointer; padding: 0 5px;
  border-radius: 3px; font-size: 11px; line-height: 1.6;
}
.branch-nav button:hover { color: var(--text-primary); border-color: var(--text-muted); }
.branch-nav button:disabled { opacity: 0.3; cursor: default; }
.branch-nav span { min-width: 28px; text-align: center; }

/* ── Message actions ───────────────────────────────────────────── */
.msg-actions {
  display: flex; gap: 4px; margin-top: 6px;
  grid-column: 2;
  opacity: 0; transition: opacity .15s;
}
.msg:hover .msg-actions { opacity: 1; }
.msg-actions button {
  background: none; border: 1px solid transparent;
  color: var(--text-dim); cursor: pointer; padding: 2px 7px;
  border-radius: 3px; font-size: 11px;
  transition: color .1s, border-color .1s;
}
.msg-actions button:hover { color: var(--text-primary); border-color: var(--border-light); }
.msg-actions .danger:hover { color: var(--red); border-color: var(--red); }

/* ── Edit overlay ──────────────────────────────────────────────── */
.edit-area {
  grid-column: 2;
}
.edit-area textarea {
  width: 100%; background: var(--bg-surface);
  border: 1px solid var(--accent); border-radius: var(--radius-sm);
  padding: 10px 12px; color: var(--text-primary);
  font-size: 14px; font-family: var(--font);
  resize: vertical; min-height: 60px; line-height: 1.5;
  outline: none;
}
.edit-area .edit-btns {
  display: flex; gap: 6px; margin-top: 6px;
}
.edit-area .edit-btns button {
  padding: 4px 14px; border-radius: var(--radius-sm);
  font-size: 12px; cursor: pointer; border: 1px solid var(--border);
}
.edit-area .edit-btns .save-btn {
  background: var(--accent); color: #fff; border-color: var(--accent);
}
.edit-area .edit-btns .save-btn:hover { background: var(--accent-hover); }
.edit-area .edit-btns .cancel-btn {
  background: var(--bg-surface); color: var(--text-muted);
}
.edit-area .edit-btns .cancel-btn:hover { color: var(--text-primary); }

/* ── Empty state ───────────────────────────────────────────────── */
#empty-state {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  color: var(--text-dim); gap: 8px;
}
#empty-state .logo { font-size: 32px; opacity: .3; }
#empty-state .hint { font-size: 13px; }

/* ── Input area ─────────────────────────────────────────────────── */
#input-area {
  padding: 12px 24px 16px;
  background: var(--bg-primary);
  border-top: 1px solid var(--border);
}
#input-wrap {
  max-width: 780px; margin: 0 auto;
  display: flex; align-items: flex-end; gap: 10px;
}
#input-box {
  flex: 1; background: var(--bg-surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 12px 16px;
  color: var(--text-primary);
  font-size: 14px; font-family: var(--font);
  resize: none; outline: none;
  min-height: 44px; max-height: 200px;
  line-height: 1.5;
  transition: border-color .15s;
}
#input-box:focus { border-color: var(--accent); }
#input-box::placeholder { color: var(--text-dim); }

#send-btn, #stop-btn {
  width: 42px; height: 42px;
  border-radius: var(--radius);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s;
  flex-shrink: 0;
}
#send-btn {
  background: var(--accent); color: #fff;
}
#send-btn:hover { background: var(--accent-hover); }
#send-btn:disabled { background: var(--bg-surface); color: var(--text-dim); cursor: default; }
#stop-btn {
  background: var(--red); color: #fff; display: none;
}
#stop-btn:hover { background: #dc2626; }

/* ── Auto-scroll toggle ────────────────────────────────────────── */
.input-footer {
  max-width: 780px; margin: 4px auto 0;
  display: flex; align-items: center; gap: 12px;
  font-size: 11px; color: var(--text-dim);
}
.input-footer label {
  display: flex; align-items: center; gap: 4px; cursor: pointer;
}
.input-footer input[type="checkbox"] { accent-color: var(--accent); }

/* ── Scrollbar ──────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

/* ── Responsive ─────────────────────────────────────────────────── */
@media (max-width: 768px) {
  :root { --sidebar-w: 280px; }
  #sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 100; }
  #sidebar.hidden { margin-left: 0; transform: translateX(-100%); }
  #messages { padding: 0 16px; }
  #input-area { padding: 10px 16px 12px; }
}
</style>
</head>
<body>

<!-- ── Sidebar ──────────────────────────────────────────────────── -->
<div id="sidebar">
  <h2>Settings</h2>

  <div class="sb-section">
    <div class="sb-row">
      <label class="sb-label">Prompt Mode</label>
      <select id="s-mode"></select>
    </div>
    <div class="sb-row">
      <label class="sb-label">System Prompt</label>
      <textarea class="sb-textarea" id="s-system" rows="4"></textarea>

  </div>

  <h2>Sampling</h2>
  <div class="sb-section">
    <div class="sb-row">
      <label class="sb-label">Temperature</label>
      <div class="slider-row">
        <input type="range" id="s-temp" min="0" max="2" step="0.05" value="0.8">

    </div>
    <div class="sb-row">

      <div class="slider-row">

    <div class="sb-row">

      <div class="slider-row">

    <div class="sb-row">

      <div class="slider-row">

    <div class="sb-row">

  <h2>Reasoning</h2>
  <div class="sb-section">

      </div>

  </div>

  <h2>Session</h2>

    <div class="btn-row">
      <button class="sb-btn" onclick="saveSession()">&#x1F4BE; Save</button>
      <button class="sb-btn" onclick="loadSession()">&#x1F4C2; Load</button>
      <button class="sb-btn" onclick="exportMarkdown()">&#x1F4DD; Export MD</button>
      <button class="sb-btn danger" onclick="clearContext()">&#x1F5D1; Clear</button>

<!-- ── Main ─────────────────────────────────────────────────────── -->
<div id="main">
  <div id="header">
    <button id="toggle-sidebar" title="Toggle settings">&#9776;</button>
    <span id="header-title">ezexl3 chat</span>
    <span id="header-model"></span>
  </div>
  <div id="chat-area">
    <div id="messages">
      <div id="empty-state">
        <div class="logo">&#x2728;</div>
        <div class="hint">Send a message to start chatting</div>
      </div>
    </div>
  </div>
  <div id="input-area">
    <div id="input-wrap">
      <textarea id="input-box" placeholder="Type a message... (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
      <button id="send-btn" title="Send">&#9654;</button>
      <button id="stop-btn" title="Stop">&#9632;</button>
    </div>
    <div class="input-footer">
      <label><input type="checkbox" id="autoscroll" checked> Auto-scroll</label>

    </div>

</div>

<!-- Hidden file input for session load -->
<input type="file" id="file-input" accept=".json" style="display:none">

<script>
// ── State ───────────────────────────────────────────────────────
let generating = false;
const msgContainer = document.getElementById('messages');
const emptyState = document.getElementById('empty-state');
const inputBox = document.getElementById('input-box');
const sendBtn = document.getElementById('send-btn');
const stopBtn = document.getElementById('stop-btn');
const sidebar = document.getElementById('sidebar');
let settings = {};
let modes = {};

// ── Conversation Tree ───────────────────────────────────────────
// Each node: { id, role, content, parentId, children: [], activeChild: -1 }
const tree = {
  nodes: new Map(),
  rootChildren: [],     // IDs of first-level user nodes
  activeRootChild: -1,
};

function createNode(role, content, parentId) {
  const node = {
    id: crypto.randomUUID(),
    role,
    content,
    parentId: parentId || null,
    children: [],
    activeChild: -1,
  };
  tree.nodes.set(node.id, node);
  return node;
}

function getActiveLeaf() {
  // Walk to the deepest active node
  if (tree.rootChildren.length === 0 || tree.activeRootChild < 0) return null;
  let nodeId = tree.rootChildren[tree.activeRootChild];
  let node = tree.nodes.get(nodeId);
  while (node && node.activeChild >= 0 && node.activeChild < node.children.length) {
    nodeId = node.children[node.activeChild];
    node = tree.nodes.get(nodeId);
  }
  return node;
}

function getActivePath() {
  // Returns [[user_content, assistant_content_or_null], ...] for backend context
  const path = [];
  if (tree.rootChildren.length === 0 || tree.activeRootChild < 0) return path;

  let childIds = tree.rootChildren;
  let activeIdx = tree.activeRootChild;

  while (activeIdx >= 0 && activeIdx < childIds.length) {
    const userNode = tree.nodes.get(childIds[activeIdx]);
    if (!userNode || userNode.role !== 'user') break;

    if (userNode.activeChild >= 0 && userNode.activeChild < userNode.children.length) {
      const assistNode = tree.nodes.get(userNode.children[userNode.activeChild]);
      if (assistNode) {
        path.push([userNode.content, assistNode.content]);
        childIds = assistNode.children;
        activeIdx = assistNode.activeChild;
        continue;
      }
    }
    // User node with no (active) assistant response
    path.push([userNode.content, null]);
    break;
  }
  return path;
}

function getActivePathUpTo(nodeId) {
  // Returns context tuples for everything BEFORE nodeId on the active path
  const fullPath = getActiveNodeIds();
  const path = [];
  for (let i = 0; i < fullPath.length; i++) {
    if (fullPath[i] === nodeId) break;
    const node = tree.nodes.get(fullPath[i]);
    if (node.role === 'user') {
      // Look ahead for assistant
      if (i + 1 < fullPath.length && fullPath[i + 1] !== nodeId) {
        const next = tree.nodes.get(fullPath[i + 1]);
        if (next && next.role === 'assistant') {
          path.push([node.content, next.content]);
        }
      }
    }
  }
  return path;
}

function getActiveNodeIds() {
  // Returns flat array of node IDs on the active path
  const ids = [];
  if (tree.rootChildren.length === 0 || tree.activeRootChild < 0) return ids;

  let childIds = tree.rootChildren;
  let activeIdx = tree.activeRootChild;

  while (activeIdx >= 0 && activeIdx < childIds.length) {
    const nodeId = childIds[activeIdx];
    const node = tree.nodes.get(nodeId);
    if (!node) break;
    ids.push(nodeId);
    childIds = node.children;
    activeIdx = node.activeChild;
  }
  return ids;
}

function addUserNode(content) {
  // Add a user node at the current active leaf
  const leaf = getActiveLeaf();
  const node = createNode('user', content, leaf ? leaf.id : null);

  if (!leaf) {
    // First message in tree
    tree.rootChildren.push(node.id);
    tree.activeRootChild = tree.rootChildren.length - 1;
  } else {
    leaf.children.push(node.id);
    leaf.activeChild = leaf.children.length - 1;
  }
  return node;
}

function addAssistantNode(userNodeId, content) {
  const userNode = tree.nodes.get(userNodeId);
  const node = createNode('assistant', content, userNodeId);
  userNode.children.push(node.id);
  userNode.activeChild = userNode.children.length - 1;
  return node;
}

function deleteSubtree(nodeId) {
  const node = tree.nodes.get(nodeId);
  if (!node) return;
  // Recursively delete children
  for (const childId of [...node.children]) {
    deleteSubtree(childId);
  }
  tree.nodes.delete(nodeId);
}

function deleteNode(nodeId) {
  if (generating) return;
  const node = tree.nodes.get(nodeId);
  if (!node) return;

  if (!node.parentId) {
    // Root-level node
    const idx = tree.rootChildren.indexOf(nodeId);
    if (idx >= 0) {
      tree.rootChildren.splice(idx, 1);
      deleteSubtree(nodeId);
      if (tree.rootChildren.length === 0) {
        tree.activeRootChild = -1;
      } else {
        tree.activeRootChild = Math.min(tree.activeRootChild, tree.rootChildren.length - 1);
      }
    }
  } else {
    const parent = tree.nodes.get(node.parentId);
    if (parent) {
      const idx = parent.children.indexOf(nodeId);
      if (idx >= 0) {
        parent.children.splice(idx, 1);
        deleteSubtree(nodeId);
        if (parent.children.length === 0) {
          parent.activeChild = -1;
        } else {
          parent.activeChild = Math.min(parent.activeChild, parent.children.length - 1);
        }
      }
    }
  }
  renderActiveTree();
}

function switchBranch(nodeId, direction) {
  const node = tree.nodes.get(nodeId);
  if (!node) return;

  if (!node.parentId) {
    // Root-level node
    const idx = tree.rootChildren.indexOf(nodeId);
    const newIdx = idx + direction;
    if (newIdx >= 0 && newIdx < tree.rootChildren.length) {
      tree.activeRootChild = newIdx;
    }
  } else {
    const parent = tree.nodes.get(node.parentId);
    if (!parent) return;
    const newIdx = parent.activeChild + direction;
    if (newIdx >= 0 && newIdx < parent.children.length) {
      parent.activeChild = newIdx;
    }
  }
  renderActiveTree();
}

function getSiblingInfo(nodeId) {
  const node = tree.nodes.get(nodeId);
  if (!node) return null;

  let siblings, idx;
  if (!node.parentId) {
    siblings = tree.rootChildren;
    idx = siblings.indexOf(nodeId);
  } else {
    const parent = tree.nodes.get(node.parentId);
    if (!parent) return null;
    siblings = parent.children;
    idx = siblings.indexOf(nodeId);
  }
  if (siblings.length <= 1) return null;
  return { current: idx + 1, total: siblings.length };
}

// ── Init ────────────────────────────────────────────────────────
(async () => {
  const [statusRes, settingsRes] = await Promise.all([
    fetch('/api/status'),
    fetch('/api/settings'),
  ]);
  const status = await statusRes.json();
  settings = await settingsRes.json();
  modes = status.available_modes || {};
  populateUI(status);
})();

function populateUI(status) {
  // Mode dropdown
  const sel = document.getElementById('s-mode');
  sel.innerHTML = '';
  for (const [k, desc] of Object.entries(modes)) {
    const opt = document.createElement('option');
    opt.value = k;
    opt.textContent = `${k} — ${desc}`;
    sel.appendChild(opt);
  }
  sel.value = settings.mode || 'chatml';

  // System prompt
  document.getElementById('s-system').value = settings.system_prompt || '';

  // Sliders
  setSlider('s-temp',  'v-temp',  settings.temperature, v => v.toFixed(2));
  setSlider('s-topk',  'v-topk',  settings.top_k,       v => String(Math.round(v)));
  setSlider('s-topp',  'v-topp',  settings.top_p,        v => v.toFixed(2));
  setSlider('s-minp',  'v-minp',  settings.min_p,        v => v.toFixed(3));
  setSlider('s-rep',   'v-rep',   settings.repetition_penalty, v => v.toFixed(2));
  setSlider('s-maxtok','v-maxtok',settings.max_response_tokens, v => String(Math.round(v)));

  // Toggles
  setToggle('t-think',   settings.think);
  setToggle('t-nothink', settings.no_think);
  setToggle('t-amnesia', settings.amnesia);

  // Think budget
  const tb = document.getElementById('s-thinkbudget');
  tb.value = settings.think_budget != null ? settings.think_budget : '';

  // Banned strings
  renderBans();

  // Model info
  document.getElementById('model-info').innerHTML =
    `<strong>${status.model_name}</strong><br>` +
    `Context: ${(status.context_length || 0).toLocaleString()} tokens<br>` +
    `${status.model_dir || ''}`;
  document.getElementById('header-model').textContent = status.model_name || '';
}

// ── Slider helpers ──────────────────────────────────────────────
function setSlider(sliderId, valId, value, fmt) {
  const sl = document.getElementById(sliderId);
  const vl = document.getElementById(valId);
  sl.value = value;
  vl.textContent = fmt(Number(value));
  sl.oninput = () => { vl.textContent = fmt(Number(sl.value)); };
  sl.onchange = () => syncSettings();
}

// ── Toggle helpers ──────────────────────────────────────────────
function setToggle(id, value) {
  const el = document.getElementById(id);
  el.classList.toggle('on', !!value);
  el.onclick = () => {
    el.classList.toggle('on');
    syncSettings();
  };
}

// ── Sync settings to server ─────────────────────────────────────
let syncTimer = null;
function syncSettings() {
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async () => {
    const s = {
      mode: document.getElementById('s-mode').value,
      system_prompt: document.getElementById('s-system').value,
      temperature: parseFloat(document.getElementById('s-temp').value),
      top_k: parseInt(document.getElementById('s-topk').value),
      top_p: parseFloat(document.getElementById('s-topp').value),
      min_p: parseFloat(document.getElementById('s-minp').value),
      repetition_penalty: parseFloat(document.getElementById('s-rep').value),
      max_response_tokens: parseInt(document.getElementById('s-maxtok').value),
      think: document.getElementById('t-think').classList.contains('on'),
      no_think: document.getElementById('t-nothink').classList.contains('on'),
      amnesia: document.getElementById('t-amnesia').classList.contains('on'),
      banned_strings: settings.banned_strings || [],
    };
    const tb = document.getElementById('s-thinkbudget').value;
    s.think_budget = tb ? parseInt(tb) : null;
    settings = s;
    await fetch('/api/settings', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(s),
    });
  }, 300);
}

// Debounced sync for text inputs
document.getElementById('s-system').addEventListener('input', syncSettings);
document.getElementById('s-mode').addEventListener('change', syncSettings);
document.getElementById('s-thinkbudget').addEventListener('input', syncSettings);

// ── Banned strings ──────────────────────────────────────────────
function renderBans() {
  const el = document.getElementById('banned-chips');
  el.innerHTML = '';
  (settings.banned_strings || []).forEach((s, i) => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.innerHTML = `<span>${escHtml(s)}</span><span class="x" onclick="removeBan(${i})">&times;</span>`;
    el.appendChild(chip);
  });
}
function addBan() {
  const inp = document.getElementById('banned-input');
  const v = inp.value.trim();
  if (!v) return;
  if (!settings.banned_strings) settings.banned_strings = [];
  settings.banned_strings.push(v);
  inp.value = '';
  renderBans();
  syncSettings();
}
function removeBan(i) {
  settings.banned_strings.splice(i, 1);
  renderBans();
  syncSettings();
}
document.getElementById('banned-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); addBan(); }
});

// ── Sidebar toggle ──────────────────────────────────────────────
document.getElementById('toggle-sidebar').onclick = () => sidebar.classList.toggle('hidden');

// ── Input handling ──────────────────────────────────────────────
let editingNodeId = null;

inputBox.addEventListener('input', () => {
  inputBox.style.height = 'auto';
  inputBox.style.height = Math.min(inputBox.scrollHeight, 200) + 'px';
});
inputBox.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (editingNodeId) {
      submitEdit(editingNodeId, inputBox.value);
    } else {
      sendMessage();
    }
  }
  if (e.key === 'Escape' && editingNodeId) {
    cancelInputEdit();
  }
});
sendBtn.onclick = () => {
  if (editingNodeId) {
    submitEdit(editingNodeId, inputBox.value);
  } else {
    sendMessage();
  }
};
stopBtn.onclick = () => stopGeneration();

// ── Streaming helper (THE SACRED PIPELINE) ──────────────────────
// This is extracted from the original sendMessage() WITHOUT changing
// the streaming logic. It runs the fetch+SSE+renderStreaming loop.
async function streamResponse(message, context, bodyEl) {
  let fullText = '';
  let tpsData = null;

  const resp = await fetch('/api/chat', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({message, context}),
  });

  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';

  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, {stream: true});

    const lines = buffer.split('\n');
    buffer = lines.pop();

    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      const payload = line.slice(6);
      if (payload === '[DONE]') continue;

      try {
        const evt = JSON.parse(payload);
        switch (evt.type) {
          case 'token':
            fullText += evt.text;
            renderStreaming(bodyEl, fullText);
            scrollToBottom();
            break;
          case 'tps':
            tpsData = evt;
            break;
          case 'done':
            break;
          case 'error':
            fullText += `\n\n**Error:** ${evt.message}`;
            break;
        }
      } catch {}
    }
  }

  return {fullText, tpsData};
}

// ── Send message ────────────────────────────────────────────────
async function sendMessage() {
  const text = inputBox.value.trim();
  if (!text || generating) return;

  inputBox.value = '';
  inputBox.style.height = 'auto';
  emptyState.style.display = 'none';

  // Get context from tree BEFORE adding the new node
  const context = getActivePath();

  // Add user message to tree
  const userNode = addUserNode(text);

  // Render tree (shows user message, empty assistant placeholder will be added)
  renderActiveTree();

  // Create assistant placeholder in DOM
  const assistantEl = createMsgEl('assistant', '');
  msgContainer.appendChild(assistantEl);
  const bodyEl = assistantEl.querySelector('.msg-body');

  generating = true;
  sendBtn.style.display = 'none';
  stopBtn.style.display = 'flex';
  sendBtn.disabled = true;

  try {
    const {fullText, tpsData} = await streamResponse(text, context, bodyEl);

    // Final render
    renderFinal(bodyEl, fullText);

    // Add assistant to tree
    const assistNode = addAssistantNode(userNode.id, fullText.trim());

    // Show TPS badge
    if (tpsData) {
      appendTpsBadge(assistantEl, tpsData);
    }

    // Re-render full tree to get proper action buttons
    renderActiveTree();

  } catch (e) {
    renderFinal(bodyEl, `\n\n**Error:** ${e.message}`);
  }

  generating = false;
  sendBtn.style.display = 'flex';
  stopBtn.style.display = 'none';
  sendBtn.disabled = false;
  inputBox.focus();
  scrollToBottom();
}

// ── Regenerate response ─────────────────────────────────────────
async function regenerateResponse(assistantNodeId) {
  if (generating) return;

  const assistNode = tree.nodes.get(assistantNodeId);
  if (!assistNode || assistNode.role !== 'assistant') return;

  const userNode = tree.nodes.get(assistNode.parentId);
  if (!userNode) return;

  // Context is everything BEFORE this user turn
  const context = getActivePathUpTo(userNode.id);

  // Render tree up to the user message
  renderActiveTree();

  // Create assistant placeholder
  const assistantEl = createMsgEl('assistant', '');
  msgContainer.appendChild(assistantEl);
  const bodyEl = assistantEl.querySelector('.msg-body');

  generating = true;
  sendBtn.style.display = 'none';
  stopBtn.style.display = 'flex';
  sendBtn.disabled = true;

  try {
    const {fullText, tpsData} = await streamResponse(userNode.content, context, bodyEl);
    renderFinal(bodyEl, fullText);

    // Add as new sibling assistant node
    const newAssist = addAssistantNode(userNode.id, fullText.trim());

    if (tpsData) {
      appendTpsBadge(assistantEl, tpsData);
    }

    renderActiveTree();
  } catch (e) {
    renderFinal(bodyEl, `\n\n**Error:** ${e.message}`);
  }

  generating = false;
  sendBtn.style.display = 'flex';
  stopBtn.style.display = 'none';
  sendBtn.disabled = false;
  inputBox.focus();
  scrollToBottom();
}

// ── Edit message ────────────────────────────────────────────────
function startEdit(userNodeId) {
  if (generating) return;
  const node = tree.nodes.get(userNodeId);
  if (!node || node.role !== 'user') return;

  editingNodeId = userNodeId;
  inputBox.value = node.content;
  inputBox.style.height = 'auto';
  inputBox.style.height = Math.min(inputBox.scrollHeight, 200) + 'px';
  inputBox.focus();
  inputBox.setSelectionRange(0, node.content.length);
  // Visual hint
  inputBox.style.borderColor = '#f59e0b';
}

function cancelInputEdit() {
  editingNodeId = null;
  inputBox.value = '';
  inputBox.style.height = 'auto';
  inputBox.style.borderColor = '';
}

async function submitEdit(userNodeId, newText) {
  newText = newText.trim();
  if (!newText || generating) return;

  const oldNode = tree.nodes.get(userNodeId);
  if (!oldNode) { cancelInputEdit(); return; }

  cancelInputEdit();
  emptyState.style.display = 'none';

  // Context is everything BEFORE this user node
  const context = getActivePathUpTo(userNodeId);

  // Create sibling user node
  const parent = oldNode.parentId ? tree.nodes.get(oldNode.parentId) : null;
  const newUserNode = createNode('user', newText, oldNode.parentId);

  if (!oldNode.parentId) {
    // Root-level sibling
    tree.rootChildren.push(newUserNode.id);
    tree.activeRootChild = tree.rootChildren.length - 1;
  } else if (parent) {
    parent.children.push(newUserNode.id);
    parent.activeChild = parent.children.length - 1;
  }

  renderActiveTree();

  // Create assistant placeholder
  const assistantEl = createMsgEl('assistant', '');
  msgContainer.appendChild(assistantEl);
  const bodyEl = assistantEl.querySelector('.msg-body');

  generating = true;
  sendBtn.style.display = 'none';
  stopBtn.style.display = 'flex';
  sendBtn.disabled = true;

  try {
    const {fullText, tpsData} = await streamResponse(newText, context, bodyEl);
    renderFinal(bodyEl, fullText);
    addAssistantNode(newUserNode.id, fullText.trim());
    if (tpsData) appendTpsBadge(assistantEl, tpsData);
    renderActiveTree();
  } catch (e) {
    renderFinal(bodyEl, `\n\n**Error:** ${e.message}`);
  }

  generating = false;
  sendBtn.style.display = 'flex';
  stopBtn.style.display = 'none';
  sendBtn.disabled = false;
  inputBox.focus();
  scrollToBottom();
}

// ── Stop generation ─────────────────────────────────────────────
async function stopGeneration() {
  await fetch('/api/stop', {method: 'POST'});
}

// ── Clear context ───────────────────────────────────────────────
async function clearContext() {
  await fetch('/api/clear', {method: 'POST'});
  tree.nodes.clear();
  tree.rootChildren = [];
  tree.activeRootChild = -1;
  msgContainer.innerHTML = '';
  emptyState.style.display = '';
  msgContainer.appendChild(emptyState);
}

// ── Copy message ────────────────────────────────────────────────
function copyMessage(nodeId) {
  const node = tree.nodes.get(nodeId);
  if (!node) return;
  navigator.clipboard.writeText(node.content).then(() => {
    // Brief visual feedback
    const btn = document.querySelector(`[data-copy="${nodeId}"]`);
    if (btn) {
      const orig = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = orig; }, 1000);
    }
  });
}

// ── Save/Load session ───────────────────────────────────────────
async function saveSession() {
  const resp = await fetch('/api/session/save');
  const data = await resp.json();
  // Augment with tree data
  data.tree = {
    nodes: Object.fromEntries(tree.nodes),
    rootChildren: tree.rootChildren,
    activeRootChild: tree.activeRootChild,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'chat_session.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function loadSession() {
  document.getElementById('file-input').click();
}

document.getElementById('file-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const text = await file.text();
  const data = JSON.parse(text);
  await fetch('/api/session/load', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: text,
  });
  // Reload settings
  const settingsRes = await fetch('/api/settings');
  settings = await settingsRes.json();
  const statusRes = await fetch('/api/status');
  const status = await statusRes.json();
  populateUI(status);

  // Restore tree
  if (data.tree) {
    tree.nodes = new Map(Object.entries(data.tree.nodes));
    tree.rootChildren = data.tree.rootChildren;
    tree.activeRootChild = data.tree.activeRootChild;
  } else if (data.context) {
    // Backward compat: build linear tree from flat context
    buildTreeFromFlatContext(data.context);
  }

  renderActiveTree();
  e.target.value = '';
  scrollToBottom();
});

function buildTreeFromFlatContext(contextTuples) {
  tree.nodes.clear();
  tree.rootChildren = [];
  tree.activeRootChild = -1;

  for (const [userText, assistText] of contextTuples) {
    const userNode = addUserNode(userText);
    if (assistText != null) {
      addAssistantNode(userNode.id, assistText);
    }
  }
}

// ── Export Markdown ──────────────────────────────────────────────
function exportMarkdown() {
  const path = getActivePath();
  if (path.length === 0) return;
  let md = '';
  for (const [user, assistant] of path) {
    md += `## User\n\n${user}\n\n`;
    if (assistant) md += `## Assistant\n\n${assistant}\n\n`;
  }
  const blob = new Blob([md.trim() + '\n'], {type: 'text/markdown'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'chat_export.md';
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── DOM helpers ─────────────────────────────────────────────────
function createMsgEl(role, text) {
  const msg = document.createElement('div');
  msg.className = 'msg';
  msg.innerHTML = `<div class="msg-role ${role}">${role}</div><div class="msg-body"></div>`;
  if (role === 'user' && text) {
    msg.querySelector('.msg-body').textContent = text;
  }
  return msg;
}

function appendTpsBadge(msgEl, tpsData) {
  const badge = document.createElement('div');
  badge.className = 'msg-tps';
  const ctx = tpsData.prompt_tokens ? `${tpsData.prompt_tokens.toLocaleString()} ctx` : '';
  const cached = tpsData.cached_tokens ? ` (${tpsData.cached_tokens.toLocaleString()} cached)` : '';
  let parts = [];
  if (ctx) parts.push(ctx + cached);
  parts.push(`${tpsData.new_tokens} gen · ${tpsData.tps} t/s · ${tpsData.elapsed}s`);
  if (tpsData.prefill_tps) parts.push(`prefill ${tpsData.prefill_tps} t/s`);
  badge.textContent = parts.join(' · ');
  msgEl.appendChild(badge);
}

function scrollToBottom() {
  if (!document.getElementById('autoscroll').checked) return;
  const area = document.getElementById('chat-area');
  area.scrollTop = area.scrollHeight;
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ── Tree-aware rendering ────────────────────────────────────────
function renderActiveTree() {
  msgContainer.innerHTML = '';

  const nodeIds = getActiveNodeIds();
  if (nodeIds.length === 0) {
    emptyState.style.display = '';
    msgContainer.appendChild(emptyState);
    return;
  }

  emptyState.style.display = 'none';

  for (const nodeId of nodeIds) {
    const node = tree.nodes.get(nodeId);
    if (!node) continue;

    const msgEl = document.createElement('div');
    msgEl.className = 'msg';
    msgEl.dataset.nodeId = nodeId;

    // Role label
    const roleEl = document.createElement('div');
    roleEl.className = `msg-role ${node.role}`;
    roleEl.textContent = node.role;
    msgEl.appendChild(roleEl);

    // Branch navigation (if siblings exist)
    const sibInfo = getSiblingInfo(nodeId);
    if (sibInfo) {
      const navEl = document.createElement('div');
      navEl.className = 'msg-header';
      navEl.innerHTML =
        `<div class="branch-nav">` +
        `<button onclick="switchBranch('${nodeId}', -1)" ${sibInfo.current <= 1 ? 'disabled' : ''}>&lt;</button>` +
        `<span>${sibInfo.current} / ${sibInfo.total}</span>` +
        `<button onclick="switchBranch('${nodeId}', 1)" ${sibInfo.current >= sibInfo.total ? 'disabled' : ''}>&gt;</button>` +
        `</div>`;
      msgEl.appendChild(navEl);
    }

    // Message body
    const bodyEl = document.createElement('div');
    bodyEl.className = 'msg-body';
    if (node.role === 'user') {
      bodyEl.textContent = node.content;
    } else {
      renderFinal(bodyEl, node.content);
    }
    msgEl.appendChild(bodyEl);

    // Action buttons
    const actionsEl = document.createElement('div');
    actionsEl.className = 'msg-actions';
    if (node.role === 'user') {
      actionsEl.innerHTML =
        `<button onclick="startEdit('${nodeId}')">Edit</button>` +
        `<button class="danger" onclick="deleteNode('${nodeId}')">Delete</button>`;
    } else {
      actionsEl.innerHTML =
        `<button onclick="regenerateResponse('${nodeId}')">Regen</button>` +
        `<button data-copy="${nodeId}" onclick="copyMessage('${nodeId}')">Copy</button>` +
        `<button class="danger" onclick="deleteNode('${nodeId}')">Delete</button>`;
    }
    msgEl.appendChild(actionsEl);

    msgContainer.appendChild(msgEl);
  }

  scrollToBottom();
}

// ── Keyboard shortcuts ──────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  // Ctrl+Shift+Backspace → stop generation
  if (e.ctrlKey && e.shiftKey && e.key === 'Backspace') {
    e.preventDefault();
    stopGeneration();
    return;
  }
  // Up arrow in empty input → edit last user message
  if (e.key === 'ArrowUp' && document.activeElement === inputBox && !inputBox.value.trim() && !editingNodeId) {
    const nodeIds = getActiveNodeIds();
    // Find the last user node
    for (let i = nodeIds.length - 1; i >= 0; i--) {
      const n = tree.nodes.get(nodeIds[i]);
      if (n && n.role === 'user') {
        e.preventDefault();
        startEdit(n.id);
        return;
      }
    }
  }
});

// ── Markdown rendering ──────────────────────────────────────────
// Configure marked
marked.setOptions({
  breaks: true,
  gfm: true,
});

function renderStreaming(el, text) {
  // During streaming: render with a cursor
  const {html, thinkOpen} = processThinkTags(text);
  el.innerHTML = html + '<span class="cursor"></span>';
}

function renderFinal(el, text) {
  const {html} = processThinkTags(text);
  el.innerHTML = html;
}

function processThinkTags(text) {
  // Extract <think>...</think> blocks and render them as collapsible
  let html = '';
  let remaining = text;
  let thinkOpen = false;

  while (remaining.length > 0) {
    const openIdx = remaining.indexOf('<think>');
    if (openIdx === -1) {
      // No more think tags
      if (thinkOpen) {
        // Inside unclosed think block (still streaming)
        html += renderThinkContent(remaining, true);
        remaining = '';
        thinkOpen = true;
      } else {
        html += renderMarkdown(remaining);
        remaining = '';
      }
    } else {
      // Text before think tag
      if (openIdx > 0) {
        html += renderMarkdown(remaining.substring(0, openIdx));
      }
      remaining = remaining.substring(openIdx + 7);

      const closeIdx = remaining.indexOf('</think>');
      if (closeIdx === -1) {
        // Unclosed think block
        html += renderThinkContent(remaining, true);
        remaining = '';
        thinkOpen = true;
      } else {
        html += renderThinkContent(remaining.substring(0, closeIdx), false);
        remaining = remaining.substring(closeIdx + 8);
      }
    }
  }

  return {html, thinkOpen};
}

function renderThinkContent(text, isOpen) {
  const label = isOpen ? 'Thinking...' : 'Thought';
  const openClass = isOpen ? ' open' : '';
  return `<div class="think-block">` +
    `<button class="think-toggle" onclick="this.nextElementSibling.classList.toggle('open');this.textContent=this.nextElementSibling.classList.contains('open')?'▼ ${label}':'▶ ${label}'">${isOpen ? '▼' : '▶'} ${label}</button>` +
    `<div class="think-content${openClass}">${renderMarkdown(text)}</div>` +
    `</div>`;
}

function renderMarkdown(text) {
  if (!text.trim()) return '';
  try {
    return marked.parse(text);
  } catch {
    return `<p>${escHtml(text)}</p>`;
  }
}
