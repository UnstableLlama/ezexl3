[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ezexl3"
version = "0.1.0"
description = "Single-command EXL3 quantization + measurement + reporting pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "exllamav3>=0.0.1",
    "torch>=2.0",
    "datasets>=2.0",
    "safetensors>=0.4",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "aiohttp>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ezexl3 = "ezexl3.cli:main"

[tool.setuptools.package-data]
ezexl3 = ["templates/*", "chat/static/*", "chat/static/js/*", "chat/static/lib/*", "ui/static/*", "ui/static/js/*"]


[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "online: test requires network access (upstream drift checks, etc.)",
]
